<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161618">
  <meta name="robots" content="noindex">
  <title>DareMe — Arkadaşlık daveti</title>
  <link rel="icon" href="/assets/app-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="invite-page">
  <main class="invite-shell">
    <a class="brand" href="/" aria-label="DareMe ana sayfa">
      <img src="/assets/app-icon.png" alt="" width="48" height="48">
      <span>DareMe</span>
    </a>
    <section class="invite-card">
      <div class="invite-icon">🔥</div>
      <p class="eyebrow">ARKADAŞLIK DAVETİ</p>
      <h1>Birlikte daha güçlüsünüz.</h1>
      <p>Arkadaşın seni DareMe’ye davet etti. Daveti kabul et, hedeflerinize birlikte ulaşın ve alışkanlıklarınıza meydan okuyun.</p>
      <a id="invite-action" class="button primary wide" href="#">DareMe’de aç</a>
      <p id="platform-note" class="helper">Uygulama yüklü değilse Google Play’e yönlendirileceksin.</p>
    </section>
    <a class="home-link" href="/">DareMe hakkında daha fazla bilgi</a>
  </main>
  <script src="/assets/invite.js"></script>
</body>
</html>
