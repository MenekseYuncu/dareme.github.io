<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161618">
  <meta name="robots" content="noindex">
  <title>DareMe — Challenge daveti</title>
  <link rel="icon" href="/assets/app-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="invite-page">
  <main class="invite-shell">
    <a class="brand" href="/" aria-label="DareMe ana sayfa">
      <img src="/assets/app-icon.png" alt="" width="48" height="48">
      <span>DareMe</span>
    </a>
    <section class="invite-card">
      <div class="invite-icon">⚡</div>
      <p class="eyebrow">CHALLENGE DAVETİ</p>
      <h1 id="challenge-title">Birlikte başlayalım mı?</h1>
      <p id="challenge-description">Arkadaşın seni bir challenge’a davet etti. Maddeleri incele ve bireysel ya da grup olarak başla.</p>
      <a id="challenge-action" class="button primary wide" href="#">DareMe’de incele</a>
      <p id="platform-note" class="helper">Uygulama yüklü değilse Google Play’e yönlendirileceksin.</p>
    </section>
    <a class="home-link" href="/">DareMe hakkında daha fazla bilgi</a>
  </main>
  <script src="/assets/challenge-invite.js"></script>
</body>
</html>
